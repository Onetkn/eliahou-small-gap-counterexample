name: Verify Lean proof

on:
  push:
    paths:
      - 'lean/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install elan and the pinned Lean toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/elan-install"
          gh release download v4.4.0 --repo leanprover/elan \
            --pattern elan-x86_64-unknown-linux-gnu.tar.gz \
            --dir "$RUNNER_TEMP/elan-install"
          tar -xzf "$RUNNER_TEMP/elan-install/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$RUNNER_TEMP/elan-install"
          "$RUNNER_TEMP/elan-install/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.36.0
      - name: Restore pinned source snapshots
        run: python bootstrap_mathlib.py
      - name: Resolve local dependencies and restore targeted Mathlib cache
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: '1'
        run: |
          lake update
          lake build cache
          lake env python cache_mathlib.py
      - name: Build and audit the main theorem
        run: python verify.py --json .lake/verification.json
